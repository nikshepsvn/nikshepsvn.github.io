<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG</title>
<!-- Rendered at 1200×630 to produce og.png (link previews on X, LinkedIn, Slack). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,450&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f7f6f2; color: #252b27;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 88px; box-sizing: border-box;
  }
  .top { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 600; }
  .top svg { width: 56px; height: 56px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 500; color: #4d554f; background: #f0f1ea; border: 1px solid #dedfd6; border-radius: 999px; padding: 8px 18px 8px 14px; }
  .status i { width: 10px; height: 10px; border-radius: 50%; background: #648465; }
  h1 { margin: 0; font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1.18; letter-spacing: -.015em; max-width: 980px; }
  h1 b { font-weight: 450; color: #42624d; }
  .stats { display: flex; gap: 56px; padding-top: 28px; border-top: 1px solid #dedfd6; }
  .stat b { display: block; font-family: "Newsreader", Georgia, serif; font-weight: 450; font-size: 44px; line-height: 1; }
  .stat span { display: block; margin-top: 8px; font-size: 18px; color: #656d63; }
</style>
</head>
<body>
  <div class="top">
    <svg viewBox="0 0 48 48" aria-hidden="true" style="color:#42624d"><use href="logos/personal-mark.svg#mark"/></svg>
    Nikshep Saravanan
    <span class="status"><i></i>Building a consumer product, in stealth</span>
  </div>
  <h1>I explore ideas<br /><b>by building them.</b></h1>
  <div class="stats">
    <div class="stat"><b>2</b><span>exits</span></div>
    <div class="stat"><b>$50M+</b><span>protocol volume</span></div>
    <div class="stat"><b>790K+</b><span>search impressions</span></div>
    <div class="stat"><b>1,486</b><span>GitHub stars</span></div>
  </div>
</body>
</html>
